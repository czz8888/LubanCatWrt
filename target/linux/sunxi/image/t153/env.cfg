# OpenWrt u-boot environment for Allwinner T153 (sun8iw22p1)
earlyprintk=sunxi-uart,0x02600000
initcall_debug=0
console=ttyAS0,115200
mmc_root=/dev/mmcblk0p5
init=/sbin/init
loglevel=8
cma=8M
coherent_pool=16K
mac=
wifi_mac=
bt_mac=
specialstr=
root_partition=rootfs
rootfstype=ext4
setargs_mmc=setenv bootargs earlyprintk=${earlyprintk} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${mmc_root} rootwait rw init=${init} partitions=${partitions} cma=${cma} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} coherent_pool=${coherent_pool}
boot_partition=boot
boot_normal=sunxi_flash read 0x40007800 ${boot_partition};bootm 0x40007800 ${sunxi_ramd_addr} ${sunxi_fdt_addr}
fastboot_key_value_max=0x8
fastboot_key_value_min=0x2
bootdelay=0
verify=N
sunxi_load_addr=0x40007800
sunxi_ramd_addr=0x40007800
sunxi_fdt_addr=
fdt_high=0xffffffff
sunxicmd=run setargs_mmc
sunxi_pre_cmd=${sunxicmd};sunxi_update
preboot=sunxi_get_kern_env;sunxi_preboot
bootcmd=run sunxi_pre_cmd boot_normal
